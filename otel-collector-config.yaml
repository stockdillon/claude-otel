receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: service.name
        value: ${env:OTEL_SERVICE_NAME}
        action: upsert

exporters:
  debug:
    verbosity: detailed
  otlp_grpc/newrelic:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      api-key: ${env:NEW_RELIC_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlp_grpc/newrelic]
    metrics:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlp_grpc/newrelic]
    logs:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlp_grpc/newrelic]
